appId: "com.itorrent.app"
productName: "iTorrent"
directories:
  output: "dist"
  buildResources: "resources"
files:
  - "**/*"
  - "!**/*.py"
  - "!**/venv/**"
  - "!**/__pycache__/**"
extraResources:
  - from: "resources/api"
    to: "api"
    filter: ["**/*"]
  # Some packagers place backend exe at resources/api.exe instead of resources/api/api.exe
  - from: "resources/api"
    to: "api.exe"
    filter: ["api.exe"]
win:
  target: "portable"
  icon: "icon.ico"
  signAndEditExecutable: false





