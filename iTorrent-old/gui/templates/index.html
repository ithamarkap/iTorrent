<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTorrent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div id="root">
        <header>
            <h1>iTorrent</h1>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="theme-toggle" class="secondary-btn" style="width: auto; margin: 0;">🌙</button>
                <div class="status">Online</div>
            </div>
        </header>

        <div class="main-container">
            <!-- Sidebar -->
            <aside>
                <!-- File Selection -->
                <div class="card file-selection">
                    <h3>Add Torrent</h3>
                    <button class="primary-btn" id="select-file-btn">Select .torrent File</button>
                    <input type="file" id="file-input" accept=".torrent" style="display: none;">
                    <div class="magnet-input">
                        <span>or paste Magnet Link:</span>
                        <div class="input-group">
                            <input type="text" placeholder="magnet:?xt=urn:btih..." id="magnet-link">
                            <button class="secondary-btn" id="add-magnet-btn">Add</button>
                        </div>
                    </div>
                </div>

                <!-- Download Directory -->
                <div class="card download-dir">
                    <span class="label">Download Location:</span>
                    <code id="download-path">Default Downloads Folder</code>
                    <input type="file" id="dir-input" webkitdirectory directory style="display: none;">
                    <button class="secondary-btn" id="change-dir-btn">Change</button>
                </div>

                <!-- Peer List Viewer -->
                <div class="card peer-viewer">
                    <h3>Peer List Viewer</h3>
                    <p style="color: var(--text-secondary); font-size: 14px;">Get peer list from torrent file or magnet
                        link</p>

                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <button class="primary-btn" id="select-torrent-btn">Select .torrent File</button>
                        <input type="file" id="torrent-file-input" accept=".torrent" style="display: none;">
                    </div>

                    <div class="input-group" style="margin-bottom: 20px;">
                        <input type="text" placeholder="or paste Magnet Link..." id="magnet-peer-link">
                        <button class="secondary-btn" id="get-peers-btn">Get Peers</button>
                    </div>

                    <div id="peer-status" style="margin-bottom: 15px; color: var(--text-secondary); font-size: 14px;">
                    </div>

                    <div id="peer-results" style="display: none;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <strong id="peer-torrent-name" style="color: var(--accent-color);"></strong>
                            <span id="peer-count" style="color: var(--text-secondary);"></span>
                        </div>
                        <div id="peer-table-container" style="max-height: 300px; overflow-y: auto;">
                            <table class="peer-table">
                                <thead>
                                    <tr>
                                        <th>IP Address</th>
                                        <th>Port</th>
                                    </tr>
                                </thead>
                                <tbody id="peer-table-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Seeding Settings -->
                <div class="card settings">
                    <h3>Seeding Settings</h3>
                    <div class="form-group">
                        <label>Stop Seeding At Ratio:</label>
                        <input type="number" step="0.1" value="1.0">
                    </div>
                    <div class="form-group">
                        <label>Upload Speed Limit (KB/s):</label>
                        <input type="number" value="0" placeholder="0 for unlimited">
                        <small>0 = Unlimited</small>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="card torrent-list-container">
                <h2>Active Torrents</h2>
                <div id="torrent-list">
                    <!-- Torrents will be injected here via JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Expose Electron API to window if available -->
    <script src="{{ url_for('static', filename='script.js') }}?v={{ range(1, 10000) | random }}"></script>
</body>

</html>
